{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Sửa người dùng #{{ user.id }}</h2>
  <form method="post">
    <div class="grid">
      <div><label>Họ tên *</label><input type="text" name="full_name" value="{{ user.full_name }}" required maxlength="100"></div>
      <div><label>Email *</label><input type="email" name="email" value="{{ user.email }}" required maxlength="120"></div>
      <div><label>Số điện thoại</label><input type="text" name="phone" value="{{ user.phone or '' }}" maxlength="20"></div>
    </div>
    <button type="submit">Lưu thay đổi</button>
    <a class="btn secondary" href="{{ url_for('index') }}">Huỷ</a>
  </form>
</div>
{% endblock %}
